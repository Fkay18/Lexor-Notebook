{% extends 'noteapp/base.html' %}

{% block title %}{{ note.title }} | Notebook{% endblock %}

{% block content %}
<div class="page-wrap">
    <a class="back-button" href="{% url 'note_list' %}"><span aria-hidden="true">&larr;</span> Back to all notes</a>
    <article class="detail-card">
        <header class="detail-card__header">
            <p class="eyebrow">Note</p>
            <div class="detail-card__title-row">
                <h1>{{ note.title }}</h1>
                <a class="note-icon-button" href="{% url 'note_update' note.pk %}" aria-label="Edit note" title="Edit note">
                    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m16 4 4 4"></path>
                        <path d="M4 20l4.5-1 11-11a2.12 2.12 0 0 0-3-3l-11 11L4 20z"></path>
                    </svg>
                </a>
            </div>
            <time class="note-card__date" datetime="{{ note.updated_at|date:'c' }}">
                Updated {{ note.updated_at|date:"M j, Y" }} at {{ note.updated_at|date:"g:i a" }}
            </time>
        </header>
        <div class="detail-card__content">{{ note.content|linebreaks }}</div>
        <div class="detail-card__actions">
            <a class="note-icon-button note-icon-button--delete" href="{% url 'note_delete' note.pk %}" aria-label="Delete note" title="Delete note">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18"></path>
                    <path d="M8 6V4h8v2"></path>
                    <path d="m19 6-1 14H6L5 6"></path>
                    <path d="M10 11v5M14 11v5"></path>
                </svg>
            </a>
        </div>
    </article>
</div>
{% endblock %}
