{% extends 'noteapp/base.html' %}

{% block title %}Password changed | Lexor Notebook{% endblock %}

{% block content %}
<div class="page-wrap auth-page">
    <section class="auth-card" aria-labelledby="auth-title">
        <p class="eyebrow">You’re all set</p>
        <h1 id="auth-title">Password changed</h1>
        <p class="auth-intro">Your password has been updated. You can now log in with your new password.</p>
        <a class="auth-submit auth-submit-link" href="{% url 'login' %}">Back to log in</a>
    </section>
</div>
{% endblock %}
