{% extends 'noteapp/base.html' %}

{% block title %}Check your email | Notebook{% endblock %}

{% block content %}
<div class="page-wrap auth-page">
    <section class="auth-card" aria-labelledby="auth-title">
        <p class="eyebrow">One more step</p>
        <h1 id="auth-title">Check your email</h1>
        <p class="auth-intro">If an account exists for that email address, you’ll receive a link to reset your password shortly.</p>
        <p class="auth-switch"><a href="{% url 'login' %}">Back to log in</a></p>
    </section>
</div>
{% endblock %}
